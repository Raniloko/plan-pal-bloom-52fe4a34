    <script>
      // Staff install the admin from /backstage via "Zum Home-Bildschirm".
      // Swap manifest, name and icon before Safari reads them, so the
      // home-screen app is "Rondo Admin" and always opens the dashboard.
      (function () {
        if (location.pathname.indexOf("/backstage") !== 0) return;
        var set = function (sel, attr, val) { var el = document.querySelector(sel); if (el) el.setAttribute(attr, val); };
        set('link[rel="manifest"]', "href", "/admin-manifest.webmanifest");
        set('link[rel="apple-touch-icon"]', "href", "/admin-apple-touch-icon.png");
        set('meta[name="apple-mobile-web-app-title"]', "content", "Rondo Admin");
        set('meta[name="theme-color"]', "content", "#0d0d0d");
        document.title = "Rondo Admin";
      })();
    </script>
